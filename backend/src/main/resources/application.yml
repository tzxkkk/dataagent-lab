spring:
  application:
    name: dataagent-lab
  datasource:
    url: jdbc:h2:mem:dataagent;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8

server:
  port: 8080

agent:
  planner:
    default-mode: ${AGENT_PLANNER_MODE:offline}
  openai:
    enabled: ${AGENT_OPENAI_ENABLED:false}
    base-url: ${AGENT_OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AGENT_OPENAI_API_KEY:}
    model: ${AGENT_OPENAI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${AGENT_OPENAI_TIMEOUT_SECONDS:30}
